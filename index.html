<style>
/* Layout: colonna unica su telefono; su PC profilo/riepilogo a sinistra e piano del giorno a destra. Tab in basso. */
:root{

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --m-col:#3A3222; --m-col-fg:#E8CF9E; --m-spu:#2C3320; --m-spu-fg:#C9D9A0;
  --m-pra:#3D2722; --m-pra-fg:#F0B3A2; --m-cen:#1F2E3D; --m-cen-fg:#A9C6E6;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1D2520; --fg:#E6EDE8; --muted:#9AABA1; --line:#2C3731;
  --accent:#7CC39C; --accent-soft:#24392D; --warn:#E9C27A; --warn-soft:#3A2F1A; --stop:#F0A3A3; --stop-soft:#3D2222;
  --m-col:#3A3222; --m-col-fg:#E8CF9E; --m-spu:#2C3320; --m-spu-fg:#C9D9A0;
  --m-pra:#3D2722; --m-pra-fg:#F0B3A2; --m-cen:#1F2E3D; --m-cen-fg:#A9C6E6;

[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
h1.big{font-family:var(--display);font-weight:400;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0}
.grid{display:grid;gap:16px;grid-template-columns:1fr;margin-top:18px}
@media (min-width:900px){.grid{grid-template-columns:340px 1fr;align-items:start}}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{margin:0 0 10px;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kcal{font-family:var(--display);font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.kcal small{font-family:var(--body);font-size:1rem;color:var(--muted)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macros div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.macros b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.macros span{font-size:.78rem;color:var(--muted)}
.facts{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin-top:14px;font-size:.92rem;font-variant-numeric:tabular-nums}
.facts span:nth-child(even){text-align:right;font-weight:600}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.alert{border-radius:14px;padding:12px 14px;font-size:.92rem;margin-top:12px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.stop{background:var(--stop-soft);color:var(--stop)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;min-width:56px;font-weight:600;flex:none}
.days button small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.days button[aria-pressed="true"] small{color:var(--surface)}
.daytot{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:14px 2px 10px;flex-wrap:wrap}
.daytot h3{margin:0;font-family:var(--display);font-weight:400;font-size:1.4rem}
.daytot span{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.meals{display:grid;gap:12px}
@media (min-width:1100px){.meals{grid-template-columns:1fr 1fr}}
.meal{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.meal-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--mc);color:var(--mcf)}
.meal-head b{font-family:var(--display);font-weight:400;font-size:1.1rem}
.meal-head .t{font-size:.88rem;opacity:.9}
.meal-head .k{margin-left:auto;font-size:.82rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.col{--mc:var(--m-col);--mcf:var(--m-col-fg)} .spu{--mc:var(--m-spu);--mcf:var(--m-spu-fg)} .pra{--mc:var(--m-pra);--mcf:var(--m-pra-fg)} .cen{--mc:var(--m-cen);--mcf:var(--m-cen-fg)}
.items{list-style:none;margin:0;padding:4px 16px 8px}
.items li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.items li:last-child{border-bottom:0}
.items .n{flex:1;min-width:0}
.items .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.sw{border:0;background:var(--mc);color:var(--mcf);width:32px;height:32px;border-radius:10px;flex:none}
.swaps{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.items li.has-sw{flex-wrap:wrap}
.chip{background:var(--accent-soft);border-radius:999px;padding:3px 10px;font-size:.84rem;font-variant-numeric:tabular-nums}
.free{padding:14px 16px;color:var(--muted)}
.cambia{margin-left:8px;border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:.8rem;font-weight:600}
.colpick{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.colpick button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-size:.92rem}
.colpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
/* form */
form{display:grid;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
label.f input,label.f select{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:400;width:100%;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:.9rem;background:var(--bg)}
.seg input:checked+label{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
legend{font-weight:600;font-size:.9rem;margin-bottom:6px;padding:0}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.btn{border:0;background:var(--accent);color:var(--surface);padding:12px 18px;border-radius:12px;font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--fg)}
.err{color:var(--stop);font-size:.88rem;min-height:1em}
.small{font-size:.85rem;color:var(--muted)}
/* spesa */
.shop{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:6px 16px;max-width:720px;margin-top:16px}
.shop label{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.shop label:last-child{border-bottom:0}
.shop input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.shop .n{flex:1;min-width:0}
.shop .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.shop label.done .n,.shop label.done .q{text-decoration:line-through;opacity:.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
/* consigli */
.advice{display:grid;gap:14px;grid-template-columns:1fr;margin-top:16px}

.advice article{background:var(--surface);border-radius:20px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
.advice h3{margin:0 0 10px;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.advice ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;max-width:65ch}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs button{border:0;background:transparent;flex:0 1 140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:12px;color:var(--muted);font-size:.78rem;font-weight:600}
nav.tabs .i{font-size:1.2rem}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.newmeal{border:1px dashed var(--accent)!important;color:var(--accent);font-weight:600;background:transparent!important}
.backdrop{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}

.x{margin-left:auto;border:0;background:var(--surface);width:38px;height:38px;border-radius:50%;font-size:1.05rem}

.rm{border:0;background:transparent;color:var(--muted);font-size:1.1rem;width:30px;height:30px;border-radius:8px}

details.addfood summary{cursor:pointer;font-weight:600;color:var(--accent)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}

details.more{margin-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600}
@media (min-width:900px){details.more:not([open]) summary{}}
/* Telefono: sezioni a tutta larghezza, barra dei giorni fissa in alto */
@media (max-width:700px){
  .wrap{padding-block:12px 96px}
  h1.big{font-size:1.6rem}

}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:30}
</style>

function compute(p){
  const bmi = p.peso/((p.alt/100)**2);
  const bmr = 10*p.peso + 6.25*p.alt - 5*p.eta + (p.sesso==="M"?5:-161); // Mifflin-St Jeor
  const tdee = bmr*ACT[p.att].f;
  const floor = p.sesso==="M"?1500:1200;
  let goal = p.obi, notes=[];
  if(goal==="giu" && bmi<20){goal="man";notes.push({k:"warn",t:"Con un BMI sotto 20 il calo di peso non è consigliato: il piano è impostato sul mantenimento."})}
  let kcal = tdee;
  if(goal==="giu"){
    const rt=RITMO[p.ritmo||"medio"];
    const def=Math.min(tdee*rt.pct,rt.max);kcal=Math.max(tdee-def,floor);
    if(tdee-def<floor) notes.push({k:"warn",t:`Per non scendere sotto ${floor} kcal, la soglia minima di sicurezza, il calo è più lento di quello scelto. Per andare più veloce serve più movimento: ogni allenamento in più a settimana alza le calorie che bruci.`});
    if((p.ritmo||"medio")==="veloce") notes.push({k:"warn",t:"Ritmo sostenuto: se senti molta fame, stanchezza o capogiri, torna al ritmo normale. Le prime settimane il calo è più rapido perché si perde anche acqua."});
  }
  if(goal==="su") kcal = tdee+Math.min(tdee*0.1,300);
  kcal = Math.round(kcal/10)*10;
  const refW = bmi>25 ? 25*((p.alt/100)**2) : p.peso; // per le proteine si usa il peso di riferimento se in sovrappeso
  const protKg = goal==="giu"?1.6:goal==="su"?1.8:1.2;
  let prot,fat,carb;
  const dt = p.dieta||"med";
  if(dt==="keto"){
    prot = Math.round(refW*1.5); carb = 30;
    fat = Math.round((kcal-prot*4-carb*4)/9);
  } else if(dt==="low"){
    prot = Math.round(refW*(protKg+0.2)); carb = Math.round(kcal*0.30/4);
    fat = Math.round((kcal-prot*4-carb*4)/9);
  } else {
    prot = Math.round(refW*protKg); fat = Math.round(kcal*0.30/9);
    carb = Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  }
  if(dt==="keto") notes.push({k:"warn",t:"La chetogenica è una dieta impegnativa: andrebbe seguita con un medico o un nutrizionista, soprattutto oltre le 3-4 settimane. I primi giorni possono dare stanchezza e mal di testa."});
  const weekly = (kcal-tdee)*7/7700;
  return {bmi,bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat,carb,weekly,goal,notes};
}

function scaleMeal(tpl,share,r,veg,keto,noCarb,wide){
  if(tpl.free) return {t:tpl.t,free:true,items:[],n:{k:0,P:0,C:0,G:0}};
  if(wide){veg=false;noCarb=false}
  let src = noCarb ? tpl.i.filter(([f])=>ROLE[f]!=="C") : tpl.i;
  let items = src.map(([f,g,s])=>{if(veg&&VEG[f]){let [nf,m]=VEG[f];if(keto&&nf==="legumi"){nf="tofu";m=1.2}return [nf,g*m,s]}return [f,g,s]});
  const tP=r.prot*share, tC=r.carb*share, tK=r.kcal*share;
  const role=(f,s)=>s?roleOf(f):"X";
  const fac=items.map(()=>1);
  const sum=(key,filter)=>items.reduce((a,[f,g,s],i)=>filter(role(f,s))?a+FOODS[f][key]*g*fac[i]/100:a,0);
  const lim=wide?{P:[0.25,6],C:[0.15,6],F:[0.1,6]}:{P:[0.75,1.8],C:[0.45,2.4],F:[0.3,3]};
  for(let it=0;it<10;it++){
    [["P",2,tP],["C",3,tC],["F",1,tK]].forEach(([R,key,target])=>{
      const mine=items.reduce((a,[f,g,s],i)=>role(f,s)===R?a+FOODS[f][key]*g/100:a,0);
      if(!mine) return;
      const others=sum(key,x=>x!==R);
      const v=Math.min(lim[R][1],Math.max(lim[R][0],(target-others)/mine));
      items.forEach(([f,g,s],i)=>{if(role(f,s)===R)fac[i]=v});
    });
  }
  // se le calorie restano basse o alte, ritocca tutte le porzioni insieme
  const kNow=sum(1,x=>x!=="X"), kFix=sum(1,x=>x==="X"); // U (legumi) si muove solo qui
  if(kNow>0){const u=wide?Math.min(3,Math.max(0.4,(tK-kFix)/kNow)):Math.min(1.5,Math.max(0.8,(tK-kFix)/kNow));items.forEach(([f,g,s],i)=>{if(s)fac[i]*=u})}
  items = items.map(([f,g,s],i)=>{
    if(!s) return [f,g];
    let v=g*fac[i];
    if(f==="uova") v=Math.max(60,Math.round(v/60)*60);
    else if(f==="olio") v=Math.max(5,Math.round(v/5)*5);
    else v=Math.round(v/5)*5;
    if(wide) v=Math.max(5,v);
    return [f,v];
  }).filter(([,g])=>g>0);
  let title = veg&&tpl.vt?tpl.vt:tpl.t; if(wide) title=tpl.t;
  if(noCarb && src.length!==tpl.i.length){title=title.replace(/ (con|e) (patate|pane integrale|pane)$/,"");if(!/verdure/.test(title))title+=" e verdure"}
  return {t:title,items,n:nutr(items)};
}

function pickTpl(slot,d,builtin,defIdx){

    if(pct.sp2) add("sp2","Merenda","spu","spu",T.spu,(d+1)%T.spu.length,pct.sp2);
    add("cen","Cena","cen","cen",T.cen,d,pct.cen,p.dieta==="low");
    const tot=meals.reduce((a,m)=>({k:a.k+m.n.k,P:a.P+m.n.P,C:a.C+m.n.C,G:a.G+m.n.G}),{k:0,P:0,C:0,G:0});
    return {meals,tot,free:meals.some(m=>m.free)};
  });
}
function qLabel(f,g){
  if(f==="uova"){const n=Math.round(g/60);return `${n} ${n===1?"uovo":"uova"} (${g} g)`}
  if(f==="olio"){const c=g/10;return `${c===0.5?"½":c.toLocaleString("it-IT")} ${c>1?"cucchiai":"cucchiaio"} (${g} g)`}
  if(FOODS[f][6]==="ml") return `${g} ml`;
  return `${g} g`;
}
// alternative per le fonti di proteine (a parità di proteine) e di grassi (a parità di calorie)
const SW_PROT=["pollo","tacchino","merluzzo","salmone","tonno","uova","bresaola","tofu","legumi","ricotta","fiocchi","mozzarella"];
// porzioni equivalenti tipiche (linee guida CREA): 100 g carne = 150 g pesce = 2 uova = 150 g legumi cotti = 100 g ricotta/mozzarella = 50 g bresaola
const PORZ={pollo:100,tacchino:100,manzo:100,vitello:100,lonza:100,merluzzo:150,orata:150,branzino:150,salmone:150,sgombro:150,tonnofr:150,gamberi:150,polpo:150,tonno:80,uova:120,bresaola:50,crudo:50,cotto:60,tofu:150,tempeh:100,seitan:100,legumi:150,lenticchie:150,ceci:150,fagioli:150,ricotta:100,fiocchi:150,mozzarella:100,primosale:100,feta:70,parmigiano:40};
const SW_FAT=["olio","avocado","mandorle","noci","nocciole","olive","burroar","pistacchi"];
function swapsFor(f,g){
  const c=FOODS[f][6], role=roleOf(f), r=x=>Math.max(5,Math.round(x/5)*5);
  const lab=(k,v)=>k==="uova"?(()=>{const n=Math.max(1,Math.round(v/60));return `${n} ${n===1?"uovo":"uova"}`})():`${r(v)} ${FOODS[k][6]==="ml"?"ml":"g"}`;
  if(["cer","pane","pat"].includes(c)){
    // 100 g pasta/riso/farro/cous cous = 130 g pane = 400 g patate
    const pasta = c==="cer"?g:c==="pane"?g/1.3:g/4;
    return [["Pasta",r(pasta)],["Riso",r(pasta)],["Farro",r(pasta)],["Cous cous",r(pasta)],["Pane integrale",r(pasta*1.3)],["Patate",r(pasta*4)]].filter(([n])=>!FOODS[f][0].startsWith(n)).map(([n,v])=>[n,v+" g"]);
  }
  const keto=profile&&profile.dieta==="keto", veg=profile&&profile.alim==="veg";
  const meat=["pollo","tacchino","merluzzo","salmone","tonno","bresaola"];
  if((role==="P"||role==="U")&&FOODS[f][2]>=5){
    const prot=FOODS[f][2]*g/100, port=PORZ[f]?g/PORZ[f]:null;
    return SW_PROT.filter(k=>k!==f&&!(keto&&k==="legumi")&&!(veg&&meat.includes(k))).map(k=>[FOODS[k][0],lab(k,port!=null?port*PORZ[k]:prot/FOODS[k][2]*100)]);
  }
  if(role==="F"){
    const kc=FOODS[f][1]*g/100;
    return SW_FAT.filter(k=>k!==f).map(k=>[FOODS[k][0],lab(k,kc/FOODS[k][1]*100)]);
  }
  return null;
}

    };
    $("csave").onclick=()=>{
      if(!st.items.length){$("c-err").textContent="Aggiungi almeno un alimento.";return}
      const t=st.t.trim()||st.items.map(([f])=>FOODS[f][0]).slice(0,3).join(", ");
      let id;
      if(ed){ed.t=t;ed.slot=st.slot;ed.i=st.items;id=ed.id}
      else{id="m"+Date.now().toString(36);MYMEALS.push({id,t,slot:st.slot,i:st.items})}
      SS.set("pasti",MYMEALS);
      if(st.when==="tutti"){CH[st.slot]="u:"+id;for(let d=0;d<7;d++)delete CH[st.slot+"_"+d]}
      else if(st.when==="giorno") CH[st.slot+"_"+day]="u:"+id;
      SS.set("scelte",CH);close();toast("Pasto salvato");go(tab);
    };
    if(ed) $("cdel").onclick=()=>{MYMEALS=MYMEALS.filter(m=>m.id!==ed.id);SS.set("pasti",MYMEALS);Object.keys(CH).forEach(k=>{if(CH[k]==="u:"+ed.id)delete CH[k]});SS.set("scelte",CH);close();toast("Pasto eliminato");go(tab)};
  }
  draw();
  setTimeout(()=>{const n=bd.querySelector(st.items.length?"#cn":"#cq");if(n)n.focus()},0);
}

// ===== VISTA PROFILO =====
function seg(name,opts,val){return `<div class="seg">${Object.entries(opts).map(([v,l])=>`<input type="radio" name="${name}" id="${name}-${v}" value="${v}" ${val===v?"checked":""}><label for="${name}-${v}">${l}</label>`).join("")}</div>`}
function renderProfilo(){
  const p=profile;
  app.innerHTML=`<h1 class="big">I tuoi dati</h1><p class="sub">Servono per calcolare quanto ti serve ogni giorno. Restano solo su questo dispositivo.</p>
  <div class="card" style="margin-top:18px;max-width:640px"><form id="pf" novalidate>
    <fieldset><legend>Sesso</legend>${seg("sesso",{F:"Donna",M:"Uomo"},p.sesso)}</fieldset>
    <div class="row2"><label class="f">Età<input id="eta" type="number" inputmode="numeric" min="18" max="90" value="${p.eta}"></label>
    <label class="f">Altezza (cm)<input id="alt" type="number" inputmode="numeric" min="140" max="220" value="${p.alt}"></label></div>
    <label class="f">Peso attuale (kg)<input id="peso" type="number" inputmode="decimal" step="0.1" min="35" max="250" value="${p.peso}"></label>
    <label class="f">Attività fisica<select id="att">${Object.entries(ACT).map(([k,v])=>`<option value="${k}" ${p.att===k?"selected":""}>${v.l}</option>`).join("")}</select></label>
    <fieldset><legend>Obiettivo</legend>${seg("obi",GOAL,p.obi)}</fieldset>
    <fieldset id="ritmo-box" ${p.obi==="giu"?"":"hidden"}><legend>Ritmo di dimagrimento</legend>${seg("ritmo",Object.fromEntries(Object.entries(RITMO).map(([k,v])=>[k,v.l+" ("+v.d+")"])),p.ritmo||"medio")}<p class="small" style="margin:4px 0 0">È una stima: il calo reale dipende anche da sonno, ciclo, ritenzione e da quanto ti muovi.</p></fieldset>
    <fieldset><legend>Tipo di dieta</legend>${seg("dieta",Object.fromEntries(Object.entries(DIETS).map(([k,v])=>[k,v.l])),p.dieta)}<p class="small" id="dietdesc" style="margin:4px 0 0">${DIETS[p.dieta].d}</p></fieldset>
    <fieldset><legend>Alimentazione</legend>${seg("alim",{onn:"Onnivora",veg:"Vegetariana"},p.alim)}</fieldset>
    <fieldset><legend>Pasti al giorno</legend>${seg("pasti",{"3":"3 pasti","5":"5 pasti (con spuntini)"},p.pasti)}</fieldset>
    <label class="chk"><input type="checkbox" id="clin" ${p.clin?"checked":""}><span>Sono in gravidanza o allattamento, oppure ho una condizione medica (diabete, malattie renali, tiroide, altro)</span></label>
    <div class="err" id="err" role="alert"></div>
    <div class="actions"><button class="btn" type="submit">Calcola il mio piano</button>${!isExample?`<button class="btn ghost" type="button" id="reset">Cancella i miei dati</button>`:""}</div>
  </form></div>
  <div class="card" style="margin-top:16px;max-width:640px"><h2>I miei pasti</h2>
    ${MYMEALS.length?`<div class="mylist">${MYMEALS.map(m=>`<div><span><b>${esc(m.t)}</b><br><span class="small">${SLOTN[m.slot]}</span></span><button class="btn ghost" data-edit="${m.id}" type="button">Modifica</button></div>`).join("")}</div>`:`<p class="small" style="margin:0">Non hai ancora creato pasti. Componine uno con gli alimenti che preferisci: l'app calcola le grammature.</p>`}
    <div class="actions"><button class="btn" type="button" id="newm">+ Crea un pasto</button></div>
  </div>`;
  document.getElementById("newm").onclick=()=>openComposer("col");
  app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openComposer(null,b.dataset.edit));
  const form=document.getElementById("pf");
  form.onsubmit=e=>{
    e.preventDefault();
    const val=n=>form.querySelector(`input[name="${n}"]:checked`).value;
    const np={sesso:val("sesso"),eta:+document.getElementById("eta").value,alt:+document.getElementById("alt").value,peso:+String(document.getElementById("peso").value).replace(",","."),att:document.getElementById("att").value,obi:val("obi"),ritmo:val("ritmo"),dieta:val("dieta"),alim:val("alim"),pasti:val("pasti"),clin:document.getElementById("clin").checked};
    const err=document.getElementById("err");
    if(!np.eta||np.eta<18){err.textContent="Il piano è pensato per adulti. Sotto i 18 anni serve un pediatra o un nutrizionista.";return}
    if(np.eta>90){err.textContent="Controlla l'età: il valore massimo è 90.";return}
    if(!np.alt||np.alt<140||np.alt>220){err.textContent="Inserisci l'altezza in centimetri, tra 140 e 220.";return}
    if(!np.peso||np.peso<35||np.peso>250){err.textContent="Inserisci il peso in chili, tra 35 e 250.";return}
    profile=np;isExample=false;S.set("profilo",np);toast("Piano aggiornato");go("piano");
  };
  form.querySelectorAll('input[name="obi"]').forEach(i=>i.onchange=()=>{document.getElementById("ritmo-box").hidden=i.value!=="giu"});
  form.querySelectorAll('input[name="dieta"]').forEach(i=>i.onchange=()=>{document.getElementById("dietdesc").textContent=DIETS[i.value].d});
  const rs=document.getElementById("reset"); if(rs) rs.onclick=()=>{try{localStorage.removeItem("dsm_profilo")}catch(e){}profile={...EXAMPLE};isExample=true;toast("Dati cancellati");renderProfilo()};
}

// ===== VISTA SPESA =====
function renderSpesa(){
  if(profile.clin){renderPiano();return}
  const r=compute(profile), week=buildWeek(profile,r), tot={};
  week.forEach(d=>d.meals.forEach(m=>m.items.forEach(([f,g])=>{tot[f]=(tot[f]||0)+g})));
  const list=Object.entries(tot).sort((a,b)=>FOODS[a[0]][0].localeCompare(FOODS[b[0]][0],"it"));
  const ck=S.get("spesa",{});
  const q=(f,g)=>{if(f==="uova")return Math.round(g/60)+" uova";const u=FOODS[f][6]==="ml"?"ml":"g";if(g>=1000)return (g/1000).toLocaleString("it-IT",{maximumFractionDigits:2})+(u==="ml"?" l":" kg");return g+" "+u};
  app.innerHTML=`<h1 class="big">Lista della spesa</h1><p class="sub">Tutto quello che serve per la settimana, pasto libero escluso. Pesi a crudo, legumi già cotti.</p>
    <div class="shop">${list.map(([f,g],i)=>`<label class="${ck[f]?"done":""}"><input type="checkbox" id="sp-${f}" data-f="${f}" ${ck[f]?"checked":""}><span aria-hidden="true">${FOODS[f][5]}</span><span class="n">${FOODS[f][0]}</span><span class="q">${q(f,g)}</span></label>`).join("")}</div>
    <div class="actions"><button class="btn" id="copy">Copia lista</button><button class="btn ghost" id="clr">Togli le spunte</button></div>`;
  app.querySelectorAll(".shop input").forEach(c=>c.onchange=()=>{const s=S.get("spesa",{});s[c.dataset.f]=c.checked;S.set("spesa",s);c.closest("label").classList.toggle("done",c.checked)});
  document.getElementById("clr").onclick=()=>{S.set("spesa",{});renderSpesa()};
  document.getElementById("copy").onclick=()=>{const t="Lista della spesa\n"+list.map(([f,g])=>"- "+FOODS[f][0]+": "+q(f,g)).join("\n");navigator.clipboard.writeText(t).then(()=>toast("Lista copiata")).catch(()=>toast("Copia non riuscita su questo dispositivo"))};
}

// ===== NAVIGAZIONE =====
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
const VIEWS={piano:renderPiano,profilo:renderProfilo,spesa:renderSpesa,consigli:renderConsigli};
function go(t){tab=t;document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});VIEWS[t]();window.scrollTo(0,0);if(location.hash.slice(1)!==t)history.replaceState(null,"","#"+t)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==tab)go(h)});
go(VIEWS[location.hash.slice(1)]?location.hash.slice(1):"piano");
</script>
